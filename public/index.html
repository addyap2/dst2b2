<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DST 2 Oral · Anglais B2</title>
  <meta name="description" content="Roue d’examen du DST 2 oral : choisissez le thème, puis lancez la roue pour tirer l’une de ses 6 questions.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#172c39">
  <link rel="stylesheet" href="./styles.css">
  <script src="./questions.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img class="main-logo" src="./assets/antony-addy-logo.webp" alt="Antony Addy" width="284" height="145">
      <span><strong>DST 2 ORAL</strong><small>BACHELOR 2 · ANGLAIS B2</small></span>
    </div>
    <div class="header-actions">
      <button class="quiet-button" id="fullscreen" type="button">Plein écran</button>
    </div>
  </header>

  <section class="theme-picker" aria-labelledby="theme-picker-title">
    <h2 id="theme-picker-title"><span>1</span>Choisissez le thème de l’étudiant</h2>
    <div class="theme-grid" id="theme-grid" role="radiogroup" aria-labelledby="theme-picker-title"></div>
  </section>

  <main>
    <section class="wheel-panel" aria-label="Roue">
      <div class="wheel-stage">
        <div class="wheel-pointer" aria-hidden="true"></div>
        <svg id="wheel" viewBox="-260 -260 520 520" role="img" aria-label="Roue des questions numérotées de 1 à 6"></svg>
        <div class="wheel-hub" aria-hidden="true"><span>THÈME</span><strong id="hub-number">–</strong></div>
      </div>
      <button class="spin-button" id="spin" type="button"><span aria-hidden="true">↻</span><span id="spin-label">Choisissez d’abord un thème</span></button>
      <p class="wheel-note">Appuyez sur <kbd>Espace</kbd> pour lancer la roue.</p>
    </section>

    <section class="conversation-panel">
      <article class="question-card" id="card" aria-live="polite">
        <div class="question-top">
          <span class="question-tag" id="theme-tag">AUCUN THÈME CHOISI</span>
          <span class="question-id" id="question-number"></span>
        </div>
        <div class="question-content">
          <h1 id="question" tabindex="-1">Choisissez le thème de l’étudiant, puis lancez la roue.</h1>
        </div>
      </article>
    </section>
  </main>

  <noscript><p class="noscript">Cette roue nécessite JavaScript.</p></noscript>
</body>
</html>
